# /etc/nginx/conf.d/bharosa.conf  (Amazon Linux: sudo cp this file there)
#
# Serves the vocal-web build and proxies the API on the same host, so the
# browser talks to https://bharosa.my-leader.in/v1 and /v2 (same origin).
#
# HTTP only on purpose: run `sudo certbot --nginx -d bharosa.my-leader.in`
# afterwards and certbot adds the 443 block + http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name bharosa.my-leader.in;

    root /var/www/bharosa;
    index index.html;

    client_max_body_size 25m;   # ticket attachments / uploads

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API (vocal-api, pm2 name: vocal-api, port 3001) ---
    location ~ ^/(v1|v2|health)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Hashed build assets: cache forever ---
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- SPA fallback (react-router): never cache index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
